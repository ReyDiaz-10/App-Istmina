name: Build Android APK with EAS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Submit preview APK to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Verify EAS authentication secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "GitHub Actions secret EXPO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build APK with EAS cloud
        run: npx --yes eas-cli@27.10.0 build --platform android --profile preview --non-interactive
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
